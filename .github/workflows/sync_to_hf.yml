name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Push Code to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://maconreman:$HF_TOKEN@huggingface.co/spaces/data-nexus-marketing/nexus-placement-intelligence main